<template>
    <lightning-layout vertical-align="center" horizontal-align="spread" class="slds-m-bottom_small">
        <lightning-layout-item size="4">
            <lightning-button-group>
                <lightning-button
                    label="New"
                    icon-name="action:new"
                    onclick={handleNewClick}>
                </lightning-button>
                <lightning-button
                    label="Edit"
                    icon-name="action:edit"
                    onclick={handleEditClick}>
                </lightning-button>
                <lightning-button
                    label="Delete"
                    icon-name="utility:delete"
                    onclick={handleDeleteClick}>
                </lightning-button>
            </lightning-button-group>
        </lightning-layout-item>
        <lightning-layout-item size="8">
            <lightning-layout horizontal-align="spread" vertical-align="center">
                <lightning-layout-item size="4">
                    <lightning-input
                        label="Search Expense"
                        placeholder="Search expense by name"
                        type="search"
                        onchange={handleSearch}
                        variant="label-hidden"
                        lwc:ref="searchExpense">
                    </lightning-input>
                </lightning-layout-item>
                <lightning-layout-item size="3">
                    <lightning-button
                        label="Advanced Search"
                        onclick={handleAdvancedSearchClick}
                        stretch="true"
                        icon-name="utility:search">
                    </lightning-button>
                </lightning-layout-item>
                <lightning-layout-item size="3">
                    <lightning-button
                        label="Clear search"
                        onclick={handleClearSearch}
                        stretch="true"
                        icon-name="action:filter">
                    </lightning-button>
                </lightning-layout-item>
            </lightning-layout>
        </lightning-layout-item>
    </lightning-layout>
    <div lwc:if={isNoResult} class="slds-text-align_center slds-size_1-of-1 slds-m-top_large">
        <p>No expenses were found</p>
    </div>
    <div class="slds-scrollable table-container" lwc:else>
        <lightning-datatable
            key-field="Id"
            columns={expensesColumnsGetter}
            data={expensesData}
            selected-rows={selectedExpenseIds}
            onrowselection={handleRowSelection}
            onloadmore={handleLoadMoreExpenses}
            is-loading={isLoading}
            sorted-direction={sortDirection}
            sorted-by={sortedBy}
            onsort={handleSort}
            max-row-selection="1"
            enable-infinite-loading
            show-row-number-column
            lwc:ref="expensesTable">
        </lightning-datatable>
    </div>
</template>
