<template>
    <lightning-modal-header label={label}></lightning-modal-header>
    <lightning-modal-body>
        <lightning-spinner
            lwc:if={isLoading}
            alternative-text="Loading..."
            class="slds-is-relative slds-align_absolute-center slds-m-top_medium">
        </lightning-spinner>
        <lightning-layout vertical-align="start" class="slds-m-bottom_small" multiple-rows="true">
            <lightning-layout-item size="12">
                <lightning-input
                    label="Status"
                    placeholder="Search expense by status"
                    type="search"
                    onchange={handleStatusSearch}>
                </lightning-input>
            </lightning-layout-item>
            <lightning-layout-item size="12">
                <lightning-input
                    label="Created Date"
                    placeholder="Search expense by created date"
                    type="search"
                    onchange={handleCreatedDateSearch}>
                </lightning-input>
            </lightning-layout-item>
            <lightning-layout-item size="12">
                <lightning-input
                    label="Amount"
                    placeholder="Search expense by amount"
                    type="search"
                    onchange={handleAmountSearch}>
                </lightning-input>
            </lightning-layout-item>
            <lightning-layout-item size="12">
                <lightning-input
                    label="Due Date"
                    placeholder="Search expense by due date"
                    type="search"
                    onchange={handleDueDateSearch}>
              </lightning-input>
            </lightning-layout-item>
            <lightning-layout-item size="12">
                <lightning-input
                    label="Description"
                    placeholder="Search expense by description"
                    type="search"
                    onchange={handleDescriptionSearch}>
                </lightning-input>
            </lightning-layout-item>
        </lightning-layout>
    </lightning-modal-body>
    <lightning-modal-footer>
        <div class="slds-grid slds-wrap slds-grid_align-spread slds-align_absolute-center slds-p-around_xx-small">
            <lightning-button
                label="Cancel"
                onclick={handleCancel}
                class="slds-m-right_small">
            </lightning-button>
            <lightning-button
                label="Search"
                onclick={handleSearch}
                variant="brand"
                class="slds-m-right_small">
            </lightning-button>
        </div>
    </lightning-modal-footer>
</template>
