<template>
    <lightning-modal-header label={label}></lightning-modal-header>
    <lightning-modal-body>
        <lightning-spinner
            lwc:if={isLoading}
            alternative-text="Loading..."
            class="slds-is-relative slds-align_absolute-center slds-m-top_medium">
        </lightning-spinner>
        <lightning-record-edit-form
            object-api-name="Expense__c"
            lwc:ref="recordEditForm"
            onload={handleLoad}>
            <lightning-input-field
                field-name={expenseStatusGetter}
                onchange={handleStatusFieldChange}
                value={statusSearchValue}>
            </lightning-input-field>
            <lightning-input
                label="Created Date"
                type="date"
                onchange={handleCreatedDateFieldChange}
                value={createdDateSearchValue}>
            </lightning-input>
            <lightning-input-field
                field-name={expenseAmountGetter}
                onchange={handleAmountFieldChange}
                value={amountSearchValue}>
            </lightning-input-field>
            <lightning-input-field
                field-name={expenseDueDateGetter}
                onchange={handleDueDateFieldChange}
                value={dueDateSearchValue}>
            </lightning-input-field>
            <lightning-input-field
                field-name={expenseDescriptionGetter}
                onchange={handleDescriptionFieldChange}
                value={descriptionSearchValue}>
            </lightning-input-field>
        </lightning-record-edit-form>
    </lightning-modal-body>
    <lightning-modal-footer>
        <div class="slds-align_absolute-center slds-p-around_xx-small">
            <lightning-button
                label="Cancel"
                onclick={handleCancelClick}
                class="slds-m-right_small">
            </lightning-button>
            <lightning-button
                label="Search"
                onclick={handleSearchClick}
                variant="brand"
                class="slds-m-right_small">
            </lightning-button>
        </div>
    </lightning-modal-footer>
</template>
